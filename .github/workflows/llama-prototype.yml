name: LlamaPrototype Build (iOS Metal)

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
        with:
          repository: landsspacesss/OpenMinis
          ref: main

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          cmake --version | head -1

      # ============ 1. 下载 llama.cpp 官方预编译 XCFramework ============
      # 官方 release 提供 xcframework(含 iOS device + Metal 切片)
      - name: Download official llama.cpp XCFramework
        run: |
          mkdir -p prototype/Frameworks
          echo "下载 llama.cpp 官方 xcframework..."
          curl -sL --max-time 600 -o /tmp/llama-xc.zip \
            "https://github.com/ggml-org/llama.cpp/releases/download/b10326/llama-b10326-xcframework.zip"
          ls -lh /tmp/llama-xc.zip
          unzip -q /tmp/llama-xc.zip -d prototype/Frameworks/
          echo "=== xcframework 结构 ==="
          find prototype/Frameworks -name "*.xcframework" -maxdepth 3
          echo "=== 切片列表 ==="
          find prototype/Frameworks -name "*.xcframework" -maxdepth 3 -exec ls {} \;
          echo "=== Headers ==="
          find prototype/Frameworks -name "llama.h" | head -5

      - name: Setup project structure
        working-directory: prototype
        run: |
          # pbxproj 已提交在 prototype/LlamaPrototype.xcodeproj/project.pbxproj
          ls -la LlamaPrototype.xcodeproj/
          ls -la LlamaPrototype.xcodeproj/project.pbxproj || echo "⚠️ pbxproj 缺失"

      # ============ 3. 编译 app (device, 无签名) ============
      - name: Build app for device
        working-directory: prototype
        run: |
          set -o pipefail
          xcodebuild build \
            -project LlamaPrototype.xcodeproj \
            -scheme LlamaPrototype \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -40

      # ============ 4. 打包 unsigned ipa ============
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find /tmp/dd/Build/Products -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app"
            find /tmp/dd/Build/Products -maxdepth 3 2>/dev/null | head -20
            exit 1
          fi
          ls -la "$APP_PATH"
          mkdir -p /tmp/ipa/Payload
          cp -r "$APP_PATH" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -qr LlamaPrototype-unsigned.ipa Payload
          ls -lh LlamaPrototype-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LlamaPrototype-unsigned-ipa
          path: /tmp/ipa/LlamaPrototype-unsigned.ipa
          if-no-files-found: error
