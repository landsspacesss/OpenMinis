name: LlamaPrototype Build (iOS Metal)

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
        with:
          repository: landsspacesss/OpenMinis
          ref: main

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          cmake --version | head -1

      # ============ 1. 编译 llama.cpp 静态库 (iOS device + Metal) ============
      # 官方 build-xcframework.sh 在 Xcode 15 下 ios-device 切片静默失败,
      # 改用 cmake 直接编 iOS arm64 静态库
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: llama-cpp

      - name: Build llama.cpp static lib (iOS device + Metal)
        working-directory: llama-cpp
        run: |
          # 手写 iOS toolchain,强制 iOS 目标(直接 -DCMAKE_SYSTEM_NAME 在 macOS host 上被忽略)
          cat > /tmp/ios-toolchain.cmake << 'EOF'
          set(CMAKE_SYSTEM_NAME iOS)
          set(CMAKE_SYSTEM_VERSION 17.0)
          set(CMAKE_OSX_SYSROOT iphoneos)
          set(CMAKE_OSX_ARCHITECTURES arm64)
          set(CMAKE_C_COMPILER_WORKS TRUE)
          set(CMAKE_CXX_COMPILER_WORKS TRUE)
          set(CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED NO)
          set(CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED NO)
          EOF
          cmake -B build-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/ios-toolchain.cmake \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_MTMD=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_BLAS=OFF \
            -DGGML_OPENMP=OFF \
            -S . 2>&1 | grep -E "Target:|Including|error" | head -5
          # 找到 xcodeproj 并构建
          XCPROJ=$(find build-ios -name "*.xcodeproj" -maxdepth 2 | head -1)
          echo "找到工程: $XCPROJ"
          xcodebuild -project "$XCPROJ" \
            -target ALL_BUILD \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=/tmp/llama-build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -12
          echo "=== 静态库产物 ==="
          find /tmp/llama-build -name "*.a" | head -12
          echo "=== 静态库产物 ==="
          find /tmp/llama-build -name "*.a" | head -12

      - name: Copy libs and headers
        run: |
          mkdir -p prototype/llama-libs
          # 静态库
          find /tmp/llama-build -name "*.a" -exec cp {} prototype/llama-libs/ \; 2>/dev/null
          ls -la prototype/llama-libs/ | head -15
          # 头文件
          mkdir -p prototype/llama-libs/include
          cp llama-cpp/include/llama.h prototype/llama-libs/include/
          cp llama-cpp/ggml/include/*.h prototype/llama-libs/include/ 2>/dev/null
          ls prototype/llama-libs/include/ | head -12

      - name: Locate and copy libs
        run: |
          echo "=== 静态库列表 ==="
          ls -la prototype/llama-libs/
          echo "=== 头文件 ==="
          ls prototype/llama-libs/include/ | head -15

      # ============ 2. 工程文件已手写(pbxproj, Xcode 15 兼容格式) ============
      - name: Setup project structure
        working-directory: prototype
        run: |
          # pbxproj 已提交在 prototype/LlamaPrototype.xcodeproj/project.pbxproj
          ls -la LlamaPrototype.xcodeproj/
          ls -la LlamaPrototype.xcodeproj/project.pbxproj || echo "⚠️ pbxproj 缺失"

      # ============ 3. 编译 app (device, 无签名) ============
      - name: Build app for device
        working-directory: prototype
        run: |
          set -o pipefail
          xcodebuild build \
            -project LlamaPrototype.xcodeproj \
            -scheme LlamaPrototype \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -40

      # ============ 4. 打包 unsigned ipa ============
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find /tmp/dd/Build/Products -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app"
            find /tmp/dd/Build/Products -maxdepth 3 2>/dev/null | head -20
            exit 1
          fi
          ls -la "$APP_PATH"
          mkdir -p /tmp/ipa/Payload
          cp -r "$APP_PATH" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -qr LlamaPrototype-unsigned.ipa Payload
          ls -lh LlamaPrototype-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LlamaPrototype-unsigned-ipa
          path: /tmp/ipa/LlamaPrototype-unsigned.ipa
          if-no-files-found: error
