name: LlamaPrototype Build (iOS Metal)

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
        with:
          repository: landsspacesss/OpenMinis
          ref: main

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          cmake --version | head -1

      # ============ 1. 下载预编译的 llama.cpp xcframework ============
      # 直接使用 llama.rn(PocketPal 同款)发布的预编译 iOS xcframework,
      # 包含 ios-arm64(device, Metal)切片,绕开所有 cmake/Xcode 编译坑
      - name: Download prebuilt llama xcframework
        run: |
          mkdir -p prototype/Frameworks
          echo "下载 llama-rn-ios-xcframework..."
          curl -sL --max-time 500 -o /tmp/llama-xc.tar.gz \
            "https://github.com/mybigday/llama.rn/releases/download/v0.12.9/llama-rn-ios-xcframework.tar.gz"
          ls -lh /tmp/llama-xc.tar.gz
          tar xzf /tmp/llama-xc.tar.gz -C prototype/Frameworks/
          echo "=== xcframework 结构 ==="
          find prototype/Frameworks -name "rnllama.xcframework" -maxdepth 4
          echo "=== device 切片确认 ==="
          find prototype/Frameworks -path "*ios-arm64*" -name "rnllama" | head -3
          find prototype/Frameworks -name "rn-llama.h" | head -2

      - name: Setup project structure
        working-directory: prototype
        run: |
          # pbxproj 已提交在 prototype/LlamaPrototype.xcodeproj/project.pbxproj
          ls -la LlamaPrototype.xcodeproj/
          ls -la LlamaPrototype.xcodeproj/project.pbxproj || echo "⚠️ pbxproj 缺失"

      # ============ 3. 编译 app (device, 无签名) ============
      - name: Build app for device
        working-directory: prototype
        run: |
          set -o pipefail
          xcodebuild build \
            -project LlamaPrototype.xcodeproj \
            -scheme LlamaPrototype \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -40

      # ============ 4. 打包 unsigned ipa ============
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find /tmp/dd/Build/Products -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app"
            find /tmp/dd/Build/Products -maxdepth 3 2>/dev/null | head -20
            exit 1
          fi
          ls -la "$APP_PATH"
          mkdir -p /tmp/ipa/Payload
          cp -r "$APP_PATH" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -qr LlamaPrototype-unsigned.ipa Payload
          ls -lh LlamaPrototype-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LlamaPrototype-unsigned-ipa
          path: /tmp/ipa/LlamaPrototype-unsigned.ipa
          if-no-files-found: error
