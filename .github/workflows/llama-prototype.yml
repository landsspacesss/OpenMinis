name: LlamaPrototype Build (iOS Metal)

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
        with:
          repository: landsspacesss/OpenMinis
          ref: main

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          cmake --version | head -1

      # ============ 1. 编译 llama.cpp XCFramework (Metal) ============
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: llama-cpp

      - name: Build llama.cpp XCFramework
        working-directory: llama-cpp
        run: |
          # 官方脚本: iOS arm64 + simulator arm64, Metal 加速
          chmod +x build-xcframework.sh
          ./build-xcframework.sh 2>&1 | tail -20
          echo "=== 产物 ==="
          ls -la build-apple/ 2>/dev/null || ls -la *.xcframework 2>/dev/null || find . -name "*.xcframework" -maxdepth 3 2>/dev/null

      - name: Locate and copy XCFramework
        run: |
          XCF=$(find llama-cpp -name "*.xcframework" -maxdepth 3 -type d | head -1)
          echo "找到 xcframework: $XCF"
          if [ -z "$XCF" ]; then
            echo "::error::llama.cpp 未产出 xcframework"
            exit 1
          fi
          mkdir -p prototype/Frameworks
          cp -r "$XCF" prototype/Frameworks/
          echo "=== xcframework 结构 ==="
          find prototype/Frameworks -maxdepth 3 -type d | head -20
          echo "=== Headers ==="
          find prototype/Frameworks -name "llama.h" | head -3

      # ============ 2. 工程文件已手写(pbxproj, Xcode 15 兼容格式) ============
      - name: Setup project structure
        working-directory: prototype
        run: |
          # pbxproj 已提交在 prototype/LlamaPrototype.xcodeproj/project.pbxproj
          ls -la LlamaPrototype.xcodeproj/
          ls -la LlamaPrototype.xcodeproj/project.pbxproj || echo "⚠️ pbxproj 缺失"

      # ============ 3. 编译 app (device, 无签名) ============
      - name: Build app for device
        working-directory: prototype
        run: |
          set -o pipefail
          xcodebuild build \
            -project LlamaPrototype.xcodeproj \
            -scheme LlamaPrototype \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -40

      # ============ 4. 打包 unsigned ipa ============
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find /tmp/dd/Build/Products -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app"
            find /tmp/dd/Build/Products -maxdepth 3 2>/dev/null | head -20
            exit 1
          fi
          ls -la "$APP_PATH"
          mkdir -p /tmp/ipa/Payload
          cp -r "$APP_PATH" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -qr LlamaPrototype-unsigned.ipa Payload
          ls -lh LlamaPrototype-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LlamaPrototype-unsigned-ipa
          path: /tmp/ipa/LlamaPrototype-unsigned.ipa
          if-no-files-found: error
