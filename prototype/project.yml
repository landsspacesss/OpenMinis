# XcodeGen 工程配置 — 原型验证 App
# 在 workflow 中: brew install xcodegen && xcodegen generate
name: LlamaPrototype
options:
  bundleIdPrefix: com.minis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # 关键:XcodeGen 默认生成最新格式(77),macos-14 的 Xcode 15 打不开
  # xcode15_3 是最老可用选项(macos-14 带 Xcode 15.4,可读)
  projectFormat: "xcode15_3"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  LlamaPrototype:
    type: application
    platform: iOS
    sources:
      - llama-prototype
      - llama-bridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minis.llamaprototype
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        # 通过 framework 的模块头引用(自动搜索 framework Headers)
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
    preBuildScripts:
      - name: Verify llama framework
        script: |
          ls -la "$SRCROOT/Frameworks/llama.xcframework/ios-arm64/" 2>/dev/null || echo "WARN: framework 结构不同"
          find "$SRCROOT/Frameworks" -name "llama.h" 2>/dev/null | head -2
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
